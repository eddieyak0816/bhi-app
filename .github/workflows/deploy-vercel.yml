name: Deploy to Vercel

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy to Vercel (if token present)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail fast if no VERCEL_TOKEN
        if: ${{ !secrets.VERCEL_TOKEN }}
        run: |
          echo "VERCEL_TOKEN not set — to auto-deploy, add a Vercel Personal Token as repo secret VERCEL_TOKEN or connect the repo in the Vercel dashboard." >&2
          exit 78

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Vercel (prod)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx vercel --prod --token "$VERCEL_TOKEN" --confirm

      - name: Deployment info
        run: echo "If the deploy succeeded the public URL is shown above in the vercel output. You can also open https://vercel.com/dashboard to see the project." 
